name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node-version: [20, 22]
      fail-fast: false
    uses: ./.github/workflows/test-reusable.yml
    with:
      node-version: ${{ matrix.node-version }}

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ci-demo:latest .
